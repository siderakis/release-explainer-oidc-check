# TEST (Foreman, 2026-10-25): the published action given a key the provider
# refuses, on a real pull request. The pull request's check must pass with one
# warning, publish nothing, and leave the one-line setup note.
# The token below is deliberately invalid; it is not a secret.
name: Refused key check

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - id: run
        uses: bisque-cloud/presenter@8b80753a7a03f67f15c797eeb18ffa3cbb87ea9c
        with:
          source: pull-request
          when: judged
          claude-code-oauth-token: sk-ant-oat01-deliberately-invalid-test-token
      - run: |
          echo "refused=${{ steps.run.outputs.refused }}"
          echo "skipped=${{ steps.run.outputs.skipped }}"
          echo "watch-url=${{ steps.run.outputs.watch-url }}"
