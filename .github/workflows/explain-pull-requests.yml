# The pull request explainer exactly as docs/github describes it, except that
# it runs the action from this repository's own copy (`uses: ./`) instead of
# bisque-cloud/presenter@v1, so the branch under test is what runs.
name: Pull request explainer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write # post the watch link as a comment
  issues: write # react to the comment that mentions @bisque-cloud
  id-token: write # publish as this repository, no Bisque account

jobs:
  explain:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@bisque-cloud')
    runs-on: ubuntu-latest
    steps:
      - name: Check the mention and write access, and react so the commenter knows
        id: mention
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BODY: ${{ github.event.comment.body }}
        run: |
          if ! grep -Eiq '(^|[[:space:]])@bisque-cloud([[:space:].,!?;:]|$)' <<<"$BODY"; then
            echo "No @bisque-cloud mention."; exit 0
          fi
          perm="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)"
          case "$perm" in
            write|maintain|admin) echo "$ACTOR: $perm" ;;
            *) echo "::error::$ACTOR has '$perm' permission; @bisque-cloud needs write."; exit 1 ;;
          esac
          gh api --silent -X POST \
            "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes
          echo "explain=true" >> "$GITHUB_OUTPUT"
      - if: steps.mention.outputs.explain == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: steps.mention.outputs.explain == 'true'
        uses: ./
        with:
          source: pull-request
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This repository is public, so the default would list every test
          # run on its channel and in the sitemap. Test runs stay private.
          visibility: private
